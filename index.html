    const CopyButton = ({ text, colorClass = "bg-emerald-900/60 hover:bg-emerald-600 text-emerald-200" }) => {
      const [copied, setCopied] = useState(false);
      const handleCopy = () => {
        if (navigator?.clipboard) {
          navigator.clipboard.writeText(text);
          setCopied(true);
          setTimeout(() => setCopied(false), 2000);
        }
      };
      return html`
        <button
          onClick=${handleCopy}
          className=${`absolute top-4 right-4 ${colorClass} px-4 py-2 rounded-lg flex items-center gap-2 font-bold text-sm transition-colors z-10 shadow-lg`}
        >
          ${copied ? html`<${Check} className="w-4 h-4"/>` : html`<${Copy} className="w-4 h-4"/>`}
          ${copied ? "¡Copiado!" : "Copiar"}
        </button>
      `;
    };
