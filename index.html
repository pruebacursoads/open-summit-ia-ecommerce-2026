        if (navigator?.clipboard) {
          navigator.clipboard.writeText(text);
          setCopied(true);
          setTimeout(() => setCopied(false), 2000);
        }
      };
      return html`
        <button
          onClick=${handleCopy}
          className=${`absolute top-5 right-5 ${colorClass} px-5 py-2.5 rounded-xl flex items-center gap-2 font-bold text-sm transition-colors z-10 shadow-lg`}
        >
          ${copied ? html`<${Check} className="w-4 h-4"/>` : html`<${Copy} className="w-4 h-4"/>`}
